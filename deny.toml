[licenses]
allow = [
  # permissive licenses
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # permissive license with unclear patent grant
  "CC0-1.0",
  # weak/limited copyleft licenses
  "MPL-2.0",
]

[advisories]
ignore = [
  # paste is unmaintained. Compile-time proc-macro dependency only, no runtime impact, and no
  # maintained drop-in replacement in the pinned dependency graph.
  # https://rustsec.org/advisories/RUSTSEC-2024-0436
  "RUSTSEC-2024-0436",
  # crossbeam-utils: invalid pointer deref in the `fmt::Pointer` impl for `Atomic`/`Shared`.
  # No fixed release exists yet (0.8.22 is latest) and hnc never debug-formats those types.
  # https://rustsec.org/advisories/RUSTSEC-2026-0204
  "RUSTSEC-2026-0204",
  # git2: potential UB in `Remote::list()`. Only pulled transitively (shadow-rs build-time git
  # info, foundry); hnc does not call the affected API and no newer 0.20.x release is available.
  # https://rustsec.org/advisories/RUSTSEC-2026-0183
  "RUSTSEC-2026-0183",
  # git2: potential UB constructing a `Signature` from a buffer-created `BlameHunk`. Same
  # transitive-only exposure as above; not reachable from hnc and no fixed release available.
  # https://rustsec.org/advisories/RUSTSEC-2026-0184
  "RUSTSEC-2026-0184",
  # quick-xml: quadratic duplicate-attribute check and unbounded namespace allocation. Only a
  # build-dependency of soldeer's email parser (via foundry); no fixed release is available
  # through that path.
  # https://rustsec.org/advisories/RUSTSEC-2026-0194
  # https://rustsec.org/advisories/RUSTSEC-2026-0195
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # zip: SUID/SGID bits preserved during extraction. zip 8 is only pulled by soldeer-core (via
  # foundry-config); its newest release still requires zip 8 and hnc never extracts archives.
  # https://rustsec.org/advisories/RUSTSEC-2026-0367
  "RUSTSEC-2026-0367",
  # zip: `ZipArchive::extract` creates symlinks pointing outside the destination. Same
  # soldeer-only exposure as above; not reachable from hnc and no fixed release on that path.
  # https://rustsec.org/advisories/RUSTSEC-2026-0368
  "RUSTSEC-2026-0368",
  # zip: extraction applies Unix permissions through symlinks. Same soldeer-only exposure as
  # above; not reachable from hnc and no fixed release on that path.
  # https://rustsec.org/advisories/RUSTSEC-2026-0369
  "RUSTSEC-2026-0369",
  # crypto-bigint: timing variability in operations meant to be constant-time. 0.7.x is updated
  # to the fixed 0.7.6, but 0.5.5 stays pinned by alloy-signer -> k256 -> elliptic-curve 0.13 and
  # the 0.5 line has no fix. hnc never signs with a secret key, and verifying a signature only
  # handles public data, so a timing leak exposes nothing.
  # https://rustsec.org/advisories/RUSTSEC-2026-0387
  "RUSTSEC-2026-0387",
]
yanked = "warn"

[bans]
multiple-versions = "allow"

[sources]
allow-git = [
  "https://github.com/foundry-rs/foundry",
  "https://github.com/foundry-rs/foundry-core",
  "https://github.com/foundry-rs/optimism",
  "https://github.com/paradigmxyz/reth",
  "https://github.com/paradigmxyz/solar",
  "https://github.com/tempoxyz/mpp-rs",
  "https://github.com/tempoxyz/tempo",
]
