[workspace]
default-members = ["bin/hnc"]
exclude = [".github", "assets", "hnc-up"]
members = ["bin/hnc", "crates/codegen", "crates/core", "crates/js", "crates/lexer", "crates/parser", "crates/test-runner", "crates/utils"]
resolver = "2"

[workspace.package]
edition = "2024"
homepage = "https://huff-neo.rs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/cakevm/huff-neo"
rust-version = "1.98"
version = "1.5.18"

[workspace.dependencies]
huff-neo-codegen = { path = "crates/codegen" }
huff-neo-core = { path = "crates/core" }
huff-neo-lexer = { path = "crates/lexer" }
huff-neo-parser = { path = "crates/parser" }
huff-neo-test-runner = { path = "crates/test-runner" }
huff-neo-utils = { path = "crates/utils" }

cfg-if = "1.0.4"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
eyre = "0.6.12"
indexmap = "2.14.0"
itertools = "0.14.0"
js-sys = { version = "0.3.99" }
lazy_static = "1.5.0"
phf = { version = "0.13.1", features = ["macros"] }
rand = "0.10.1"
regex = "1.12.3"

shadow-rs = "2.0.0"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.122"
yansi = "1.0.1"

# alloy
alloy-dyn-abi = { version = "1.7.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-evm = { version = "0.39.0", default-features = false }
alloy-primitives = { version = "1.7.0", default-features = false, features = ["std"] }

# revm
op-revm = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877", default-features = false }
revm = { version = "43.0.2", default-features = false, features = ["optional_no_base_fee"] }

# foundry
anvil = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-cli = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-common = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-compilers = { version = "0.21.0", default-features = false }
foundry-config = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-debugger = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-evm = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-evm-core = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-evm-networks = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }
foundry-evm-traces = { git = "https://github.com/foundry-rs/foundry", tag = "v1.8.5" }

# serde
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
tsify = { version = "0.5.6", features = ["js"] }

# dev
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
criterion = "0.8.2"
predicates = "3.1.4"
rayon = "1.12.0"

[profile.test]
debug = "full"
incremental = true

[profile.release]
codegen-units = 32
debug = "line-tables-only"
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true # stripping of debuginfo

# https://deterministic.space/high-performance-rust.html
[profile.maxperf]
# set parallel codegen to 1 to increase performance
codegen-units = 1
inherits = "release"
lto = "fat"

[patch.crates-io]
# solar (must match foundry v1.8.5)
solar-compiler = { git = "https://github.com/paradigmxyz/solar", rev = "83214bb3a96e42e75cc9d08fcd69e061b396b68f" }

# foundry-core (must match foundry v1.8.5)
foundry-block-explorers = { git = "https://github.com/foundry-rs/foundry-core", rev = "39c03a49ade2f74a6e97e2af308283a42d78d302" }
foundry-compilers = { git = "https://github.com/foundry-rs/foundry-core", rev = "39c03a49ade2f74a6e97e2af308283a42d78d302" }
foundry-fork-db = { git = "https://github.com/foundry-rs/foundry-core", rev = "39c03a49ade2f74a6e97e2af308283a42d78d302" }
foundry-wallets = { git = "https://github.com/foundry-rs/foundry-core", rev = "39c03a49ade2f74a6e97e2af308283a42d78d302" }

# op-alloy / alloy-op-evm (must match foundry v1.8.5)
alloy-op-evm = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877" }
alloy-op-hardforks = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877" }
op-alloy-consensus = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877" }
op-alloy-network = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877" }
op-alloy-rpc-types = { git = "https://github.com/foundry-rs/optimism", rev = "206d26cedb9d861b983d89fc71e1122187dfa877" }

# tempo — unify crates.io versions (pulled by mpp) with foundry's git rev
tempo-alloy = { git = "https://github.com/tempoxyz/tempo", rev = "6ef1f812c9ddcbe90a88ada73944012520942d26" }
tempo-contracts = { git = "https://github.com/tempoxyz/tempo", rev = "6ef1f812c9ddcbe90a88ada73944012520942d26" }
tempo-primitives = { git = "https://github.com/tempoxyz/tempo", rev = "6ef1f812c9ddcbe90a88ada73944012520942d26" }
